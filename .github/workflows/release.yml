---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@952f731ea96c1c9c35f13bebc14176791b94d0d0
    with:
      tag: ${{ github.ref_name }}
      bin_names: "glintindex-cli glintindex-gui"
      apt_packages: "libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev libatk1.0-dev libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev"
      use_upx: true
      cargo_args: "--locked"
    secrets: inherit
