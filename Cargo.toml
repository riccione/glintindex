[workspace]
resolver = "3"
members = [
    "crates/glintindex-core",
    "crates/glintindex-cli",
    "crates/glintindex-gui",
]
exclude = [
    "fuzz",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/riccione/glintindex"
rust-version = "1.88"

[workspace.dependencies]
glintindex-core = { path = "crates/glintindex-core" }
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
# gtk4 removed — replaced by eframe/egui
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
walkdir = "2.5"
notify = "8.2"
tantivy = "0.27"
open = "5.4"
rfd = "0.18"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
pdf-extract = "0.12"
docx-lite = "0.2"
calamine = "0.38"
zip = "9.5"
quick-xml = "0.42"
rtf-parser = "0.5"
rusqlite = { version = "0.42", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[workspace.metadata.release]
# We tag manually from `main` after the release PR is merged,
# so cargo-release must never create the tag itself.
tag = false

# Format to use if/when a tag is created (kept here for reference/consistency,
# even though `tag = false` means cargo-release itself won't create it).
tag-name = "v{{version}}"

# We push manually (release branch, then tag from main after merge),
# so cargo-release must never push.
push = false

# Private app, not published to crates.io.
publish = false

# Only allow running `cargo release` from a release prep branch
# (e.g. release/v1.2.3), never directly on the protected `main` branch.
allow-branch = ["release/v*"]

# Explicitly forces all workspace members to bump version together
shared-version = true

# Define your custom release commit message template here:
pre-release-commit-message = "chore(release): prepare release v{{version}}"
