[workspace]
resolver = "3"
members = [
    "crates/glintindex-core",
    "crates/glintindex-cli",
    "crates/glintindex-gui",
]
exclude = [
    "fuzz",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/riccione/glintindex"
rust-version = "1.85"

[workspace.dependencies]
glintindex-core = { path = "crates/glintindex-core" }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
# gtk4 removed — replaced by eframe/egui
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
anyhow = "1.0.103"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-log = "0.2.0"
walkdir = "2.5.0"
notify = "8.2.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tantivy = "0.26.1"
open = "5.3.6"
rfd = "0.17.2"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
pdf-extract = "0.12.0"
docx-lite = "0.2.0"
calamine = "0.36.0"
zip = "8.6.0"
quick-xml = "0.41.0"
rtf-parser = "0.4.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[workspace.metadata.release]
# We tag manually from `main` after the release PR is merged,
# so cargo-release must never create the tag itself.
tag = false

# Format to use if/when a tag is created (kept here for reference/consistency,
# even though `tag = false` means cargo-release itself won't create it).
tag-name = "v{{version}}"

# We push manually (release branch, then tag from main after merge),
# so cargo-release must never push.
push = false

# Private app, not published to crates.io.
publish = false

# Only allow running `cargo release` from a release prep branch
# (e.g. release/v1.2.3), never directly on the protected `main` branch.
allow-branch = ["release/v*"]

# Explicitly forces all workspace members to bump version together
shared-version = true
